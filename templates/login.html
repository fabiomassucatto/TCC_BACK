<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Login</title>
</head>
<body>
    <main class="container">

        <!-- Seletor de perfil -->
        <div class="toggle-wrapper">
            <button type="button" class="toggle-btn {% if tipo == 'usuario' %}active{% endif %}" id="btnUsuario" onclick="setRole('usuario')">
                <i class='bx bxs-user'></i> Usuário
            </button>
            <button type="button" class="toggle-btn {% if tipo == 'motorista' %}active{% endif %}" id="btnMotorista" onclick="setRole('motorista')">
                <i class='bx bxs-bus'></i> Motorista
            </button>
            <button type="button" class="toggle-btn {% if tipo == 'rh' %}active{% endif %}" id="btnRh" onclick="setRole('rh')">
                <i class='bx bxs-briefcase'></i> RH
            </button>
        </div>

        <!-- Formulário único -->
        <form method="post" action="/login" id="loginForm">
            <input type="hidden" name="tipo" id="tipoInput" value="{{ tipo }}">

            <h1 id="tituloLogin">{% if tipo == 'motorista' %}Motorista{% elif tipo == 'rh' %}RH{% else %}Login{% endif %}</h1>

            {% if erro %}
            <div class="msg-erro" role="alert">{{ erro }}</div>
            {% endif %}

            <div class="input-box">
                <input name="email" placeholder="E-mail" type="email" required>
                <i class="bx bxs-envelope"></i>
            </div>

            <div class="input-box">
                <input name="senha" placeholder="Senha" type="password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="lembrarSenha">
                <label>
                    <input type="checkbox"> Lembrar senha
                </label>
                <a href="#">Esqueci senha</a>
            </div>

            <button type="submit" class="login" id="btnSubmit">Entrar</button>

            <div class="Registrar" id="linkCadastro">
                <p>Não tem uma conta? <a href="/cadastro">Cadastre-se</a></p>
            </div>

            <div class="aviso-motorista" id="avisoRestrito">
                <p id="avisoMotorista">Acesso restrito a motoristas credenciados.</p>
                <p id="avisoRh">Acesso restrito a contas de RH cadastradas pela administração.</p>
            </div>

        </form>
    </main>

    <script>
        function setRole(role) {
            const roles = ['usuario', 'motorista', 'rh'];
            const titulos = {
                usuario: 'Login',
                motorista: 'Motorista',
                rh: 'RH'
            };
            const tipo = roles.includes(role) ? role : 'usuario';

            document.getElementById('tipoInput').value = tipo;
            document.getElementById('tituloLogin').textContent = titulos[tipo];
            document.getElementById('linkCadastro').style.display =
                tipo === 'usuario' ? 'block' : 'none';
            document.getElementById('avisoRestrito').style.display =
                tipo === 'usuario' ? 'none' : 'block';
            document.getElementById('avisoMotorista').style.display =
                tipo === 'motorista' ? 'block' : 'none';
            document.getElementById('avisoRh').style.display =
                tipo === 'rh' ? 'block' : 'none';
            document.querySelectorAll('.toggle-btn').forEach(button => {
                const ativo = button.id === `btn${tipo.charAt(0).toUpperCase()}${tipo.slice(1)}`;
                button.classList.toggle('active', ativo);
                button.setAttribute('aria-pressed', ativo);
            });
        }

        setRole(document.getElementById('tipoInput').value);
    </script>
</body>
</html>
