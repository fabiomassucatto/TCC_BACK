<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Cadastro</title>
</head>
<body>
    <main class="container">
        <form method="post" action="/cadastro" id="formCadastro">
            <h1>Cadastro</h1>

            {% if erro %}
            <div class="msg-erro"><i class='bx bx-error-circle'></i> {{ erro }}</div>
            {% endif %}

            <div class="input-box">
                <input name="nome" placeholder="Nome completo" type="text" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input name="email" placeholder="E-mail" type="email" required>
                <i class="bx bxs-envelope"></i>
            </div>

            <div class="input-box">
                <input name="senha" id="senha" placeholder="Senha" type="password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-box">
                <input name="confirmar_senha" id="confirmar_senha"
                       placeholder="Confirmar senha" type="password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <!-- Linha de ônibus -->
            <div class="input-box">
                <select name="linha" required style="width:100%;background:transparent;border:none;outline:none;color:inherit;font-size:1rem;padding:0">
                    <option value="" disabled selected>Selecione sua linha</option>
                    <option value="Linha 1">Linha 1</option>
                    <option value="Linha 2">Linha 2</option>
                    <option value="Linha 3">Linha 3</option>
                </select>
                <i class="bx bxs-bus"></i>
            </div>

            <div class="input-box">
                <input name="ponto" placeholder="Ponto de coleta (ex: Rua das Flores)" type="text" required>
                <i class="bx bxs-map"></i>
            </div>

            <p id="erroSenha" style="color:#eb5757;font-size:.82rem;margin-bottom:8px;display:none">
                <i class='bx bx-error-circle'></i> As senhas não coincidem.
            </p>

            <button type="submit" class="login">Cadastrar</button>

            <div class="Resgitrar">
                <p>Já tem uma conta? <a href="/login">Login</a></p>
            </div>
        </form>
    </main>

    <script>
        // Validação de senha no front antes de enviar
        document.getElementById("formCadastro").addEventListener("submit", function(e) {
            const s1 = document.getElementById("senha").value;
            const s2 = document.getElementById("confirmar_senha").value;
            const erro = document.getElementById("erroSenha");
            if (s1 !== s2) {
                e.preventDefault();
                erro.style.display = "block";
            } else {
                erro.style.display = "none";
            }
        });
    </script>
</body>
</html>
